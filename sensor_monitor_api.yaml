openapi: 3.0.4
info:
  title: sensor monitor
  description: обработка данных от датчика
  version: 0.1.1

servers:
  - url: http://api.sensor_monitor.com/
    description: Main (production) server

paths:
  v1/sensor_value:
    post:
      summary: Записать иноформацию о датчике в систему
      requestBody:
        required: true
        content:
          application/json:
            schema:
            type: object
            properties:
              user_id:
                type: string
                example: user-7feb24af-fc38-44de-bc38-04defc3804de
              sensor_id:
                type: string
                example: sensor-7feb24af-fc38-44de-bc38-04defc3804de
            required:
              - user_id
              - sensor_id
      responses:
        "200": # status code
          content:
            application/json:
              schema:
                val:
                  type: string

  v1/sensor_history:
    post:
      summary: Записать иноформацию о датчике в систему
      requestBody:
        required: true
        content:
          application/json:
            schema:
            type: object
            properties:
              user_id:
                type: string
                example: user-7feb24af-fc38-44de-bc38-04defc3804de
              sensor_id:
                type: string
                example: sensor-7feb24af-fc38-44de-bc38-04defc3804de
              start_timestamp:
                type: string
              finish_timestamp:
                type: string
            required:
              - user_id
              - sensor_id
      responses:
        "200": # status code
          description: история
          content:
            application/json:
            schema:
              type: object
              properties:
                schema:
                  type: array
                  items:
                    type: object
                    properties:
                      timestamp:
                        type: string
                      value:
                        type: string
